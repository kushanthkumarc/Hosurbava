<svg width="400" height="225" viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Enhanced gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    
    <!-- iPhone gradient -->
    <linearGradient id="iphoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Samsung gradient -->
    <linearGradient id="samsungGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#374151;stop-opacity:1" />
    </linearGradient>
    
    <!-- Screen gradients -->
    <linearGradient id="iphoneScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="samsungScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow filters -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.4"/>
    </filter>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Reflection filter -->
    <filter id="reflection">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dy="2" result="offset" />
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background with subtle pattern -->
  <rect width="400" height="225" fill="url(#bgGrad)"/>
  
  <!-- Background elements -->
  <circle cx="80" cy="50" r="100" fill="#3b82f6" opacity="0.05"/>
  <circle cx="320" cy="175" r="80" fill="#f59e0b" opacity="0.05"/>
  
  <!-- VS Battle Arena Effect -->
  <rect x="0" y="90" width="400" height="45" fill="rgba(245,158,11,0.1)"/>
  <rect x="0" y="90" width="400" height="2" fill="#f59e0b" opacity="0.5"/>
  <rect x="0" y="133" width="400" height="2" fill="#f59e0b" opacity="0.5"/>
  
  <!-- iPhone 15 Pro (left side) -->
  <g transform="translate(70, 45)">
    <!-- Phone shadow -->
    <ellipse cx="35" cy="120" rx="30" ry="8" fill="rgba(0,0,0,0.2)"/>
    
    <!-- Phone body -->
    <rect x="10" y="10" width="50" height="100" rx="12" fill="url(#iphoneGrad)" stroke="#cbd5e1" stroke-width="1" filter="url(#shadow)"/>
    
    <!-- Screen -->
    <rect x="13" y="18" width="44" height="84" rx="8" fill="#000000"/>
    
    <!-- Dynamic Island -->
    <rect x="25" y="22" width="12" height="4" rx="2" fill="#1f2937"/>
    
    <!-- Screen content -->
    <rect x="16" y="30" width="38" height="24" rx="4" fill="url(#iphoneScreen)"/>
    
    <!-- iOS elements -->
    <rect x="18" y="56" width="34" height="2" rx="1" fill="#60a5fa"/>
    <rect x="18" y="60" width="34" height="2" rx="1" fill="#60a5fa"/>
    <rect x="18" y="64" width="28" height="2" rx="1" fill="#60a5fa"/>
    
    <!-- App icons simulation -->
    <rect x="18" y="70" width="6" height="6" rx="1" fill="#ef4444"/>
    <rect x="26" y="70" width="6" height="6" rx="1" fill="#10b981"/>
    <rect x="34" y="70" width="6" height="6" rx="1" fill="#3b82f6"/>
    <rect x="42" y="70" width="6" height="6" rx="1" fill="#f59e0b"/>
    
    <rect x="18" y="78" width="6" height="6" rx="1" fill="#8b5cf6"/>
    <rect x="26" y="78" width="6" height="6" rx="1" fill="#06b6d4"/>
    <rect x="34" y="78" width="6" height="6" rx="1" fill="#ec4899"/>
    <rect x="42" y="78" width="6" height="6" rx="1" fill="#84cc16"/>
    
    <!-- Camera system -->
    <rect x="15" y="22" width="8" height="8" rx="4" fill="#374151"/>
    <circle cx="19" cy="26" r="2.5" fill="#1f2937"/>
    <circle cx="19" cy="26" r="1.5" fill="#6366f1"/>
    
    <!-- Side buttons -->
    <rect x="8" y="35" width="2" height="8" rx="1" fill="#9ca3af"/>
    <rect x="8" y="50" width="2" height="4" rx="1" fill="#9ca3af"/>
    
    <!-- Lightning connector -->
    <rect x="30" y="108" width="10" height="2" rx="1" fill="#374151"/>
  </g>
  
  <!-- Samsung Galaxy S24 Ultra (right side) -->
  <g transform="translate(270, 45)">
    <!-- Phone shadow -->
    <ellipse cx="35" cy="120" rx="30" ry="8" fill="rgba(0,0,0,0.2)"/>
    
    <!-- Phone body -->
    <rect x="10" y="10" width="50" height="100" rx="10" fill="url(#samsungGrad)" stroke="#4b5563" stroke-width="1" filter="url(#shadow)"/>
    
    <!-- Screen -->
    <rect x="12" y="15" width="46" height="90" rx="8" fill="#000000"/>
    
    <!-- Punch-hole camera -->
    <circle cx="48" cy="22" r="2.5" fill="#1f2937"/>
    
    <!-- Screen content -->
    <rect x="15" y="28" width="40" height="26" rx="4" fill="url(#samsungScreen)"/>
    
    <!-- One UI elements -->
    <rect x="17" y="56" width="36" height="2" rx="1" fill="#a78bfa"/>
    <rect x="17" y="60" width="36" height="2" rx="1" fill="#a78bfa"/>
    <rect x="17" y="64" width="30" height="2" rx="1" fill="#a78bfa"/>
    
    <!-- Samsung app icons -->
    <rect x="17" y="70" width="6" height="6" rx="1" fill="#1e40af"/>
    <rect x="25" y="70" width="6" height="6" rx="1" fill="#059669"/>
    <rect x="33" y="70" width="6" height="6" rx="1" fill="#dc2626"/>
    <rect x="41" y="70" width="6" height="6" rx="1" fill="#7c2d12"/>
    
    <rect x="17" y="78" width="6" height="6" rx="1" fill="#7c3aed"/>
    <rect x="25" y="78" width="6" height="6" rx="1" fill="#0891b2"/>
    <rect x="33" y="78" width="6" height="6" rx="1" fill="#be185d"/>
    <rect x="41" y="78" width="6" height="6" rx="1" fill="#65a30d"/>
    
    <!-- S Pen slot -->
    <rect x="58" y="85" width="2" height="12" rx="1" fill="#6b7280"/>
    
    <!-- Camera module -->
    <rect x="16" y="18" width="12" height="20" rx="6" fill="#374151"/>
    <circle cx="20" cy="24" r="2.5" fill="#1f2937"/>
    <circle cx="24" cy="24" r="2.5" fill="#1f2937"/>
    <circle cx="22" cy="30" r="2" fill="#1f2937"/>
    <rect x="19" y="33" width="6" height="3" rx="1.5" fill="#1f2937"/>
    
    <!-- Side buttons -->
    <rect x="60" y="35" width="2" height="8" rx="1" fill="#9ca3af"/>
    <rect x="60" y="50" width="2" height="4" rx="1" fill="#9ca3af"/>
    
    <!-- USB-C connector -->
    <rect x="30" y="108" width="10" height="2" rx="1" fill="#374151"/>
  </g>
  
  <!-- Central VS badge with animation effect -->
  <g transform="translate(200, 100)">
    <circle cx="0" cy="12" r="25" fill="#f59e0b" filter="url(#glow)"/>
    <circle cx="0" cy="12" r="20" fill="#fbbf24"/>
    <text x="0" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">VS</text>
    
    <!-- Animated lightning bolts -->
    <path d="M-35 12 L-25 5 L-30 12 L-25 19 Z" fill="#f59e0b" opacity="0.7"/>
    <path d="M35 12 L25 5 L30 12 L25 19 Z" fill="#f59e0b" opacity="0.7"/>
  </g>
  
  <!-- Play button (enhanced) -->
  <g transform="translate(200, 112.5)">
    <circle cx="0" cy="0" r="28" fill="rgba(255,255,255,0.95)" filter="url(#shadow)"/>
    <circle cx="0" cy="0" r="24" fill="rgba(255,255,255,0.9)"/>
    <polygon points="-8,-10 -8,10 15,0" fill="#1e40af"/>
    <!-- Play button shine effect -->
    <ellipse cx="-5" cy="-8" rx="3" ry="8" fill="rgba(255,255,255,0.3)" transform="rotate(-20)"/>
  </g>
  
  <!-- Specification comparison -->
  <g transform="translate(40, 165)">
    <rect x="0" y="0" width="140" height="35" fill="rgba(30,64,175,0.15)" rx="6" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
    <text x="70" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff">iPhone 15 Pro Max</text>
    <text x="70" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#93c5fd">A17 Pro • 48MP • ₹1,34,900</text>
    <text x="70" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#bfdbfe">iOS 17 • 6.7" ProMotion</text>
  </g>
  
  <g transform="translate(220, 165)">
    <rect x="0" y="0" width="140" height="35" fill="rgba(124,58,237,0.15)" rx="6" stroke="rgba(139,92,246,0.3)" stroke-width="1"/>
    <text x="70" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff">Galaxy S24 Ultra</text>
    <text x="70" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#c4b5fd">Snapdragon 8 Gen 3 • 200MP • ₹1,29,999</text>
    <text x="70" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#ddd6fe">One UI 6.1 • 6.8" S Pen</text>
  </g>
  
  <!-- Title with enhanced styling -->
  <rect x="10" y="8" width="220" height="28" fill="rgba(30,64,175,0.9)" rx="6" filter="url(#shadow)"/>
  <rect x="12" y="10" width="216" height="24" fill="rgba(59,130,246,0.8)" rx="4"/>
  <text x="20" y="26" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">📱 iPhone 15 vs Samsung S24</text>
  
  <!-- HosurBava branding -->
  <rect x="250" y="8" width="100" height="18" fill="rgba(245,158,11,0.2)" rx="4"/>
  <text x="255" y="20" font-family="Arial, sans-serif" font-size="8" fill="#fbbf24">by @HosurBava</text>
  
  <!-- Enhanced stats -->
  <g transform="translate(10, 200)">
    <rect x="0" y="0" width="90" height="18" fill="rgba(0,0,0,0.8)" rx="4"/>
    <text x="5" y="12" font-family="Arial, sans-serif" font-size="8" fill="#ffffff">👁️ 20K views • 🔥 Trending</text>
  </g>
  
  <!-- Duration and quality badges -->
  <g transform="translate(320, 200)">
    <rect x="0" y="0" width="35" height="18" fill="rgba(239,68,68,0.9)" rx="4"/>
    <text x="17.5" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#ffffff">4K</text>
  </g>
  
  <g transform="translate(365, 200)">
    <rect x="0" y="0" width="30" height="18" fill="rgba(0,0,0,0.8)" rx="4"/>
    <text x="15" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ffffff">15:23</text>
  </g>
  
  <!-- Performance indicators -->
  <g transform="translate(50, 140)">
    <rect x="0" y="0" width="60" height="12" fill="rgba(16,185,129,0.3)" rx="2"/>
    <text x="30" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#ffffff">📸 Camera Test</text>
  </g>
  
  <g transform="translate(120, 140)">
    <rect x="0" y="0" width="60" height="12" fill="rgba(239,68,68,0.3)" rx="2"/>
    <text x="30" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#ffffff">🎮 Gaming</text>
  </g>
  
  <g transform="translate(190, 140)">
    <rect x="0" y="0" width="60" height="12" fill="rgba(59,130,246,0.3)" rx="2"/>
    <text x="30" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#ffffff">🔋 Battery</text>
  </g>
  
  <g transform="translate(260, 140)">
    <rect x="0" y="0" width="60" height="12" fill="rgba(245,158,11,0.3)" rx="2"/>
    <text x="30" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#ffffff">💰 Value</text>
  </g>
  
  <!-- Engagement elements -->
  <circle cx="370" cy="40" r="8" fill="rgba(239,68,68,0.8)"/>
  <text x="370" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ffffff">🔴</text>
  
  <!-- HosurBava watermark -->
  <text x="200" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="rgba(255,255,255,0.3)">Expert Review by HosurBava</text>
</svg>