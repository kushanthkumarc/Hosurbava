<svg width="120" height="40" viewBox="0 0 120 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for phone -->
    <linearGradient id="phoneGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <!-- Gradient for background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle with gradient -->
  <circle cx="20" cy="20" r="18" fill="url(#bgGradient)" stroke="#f59e0b" stroke-width="2" filter="url(#glow)"/>
  
  <!-- Modern smartphone -->
  <rect x="12" y="10" width="16" height="20" rx="3" ry="3" fill="url(#phoneGradient)" stroke="#ffffff" stroke-width="1"/>
  <!-- Screen -->
  <rect x="13.5" y="12" width="13" height="14" rx="1.5" fill="#ffffff"/>
  <rect x="14" y="12.5" width="12" height="11" rx="1" fill="#1e40af"/>
  <!-- Home button -->
  <circle cx="20" cy="27.5" r="1.2" fill="#ffffff"/>
  <!-- Signal bars -->
  <rect x="14.5" y="13" width="1" height="1" fill="#ffffff"/>
  <rect x="16" y="13" width="1" height="1.5" fill="#ffffff"/>
  <rect x="17.5" y="13" width="1" height="2" fill="#ffffff"/>
  <rect x="19" y="13" width="1" height="2.5" fill="#ffffff"/>
  <!-- Battery -->
  <rect x="23" y="13" width="2" height="1" rx="0.2" fill="#ffffff"/>
  <rect x="25" y="13.2" width="0.4" height="0.6" fill="#ffffff"/>
  
  <!-- Company name with modern font -->
  <text x="44" y="17" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e40af">HosurBava</text>
  <text x="44" y="28" font-family="Arial, sans-serif" font-size="7" fill="#6b7280">Mobile Expert</text>
</svg>