<svg width="400" height="225" viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f9fafb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5e7eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="toolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <!-- Shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="225" fill="url(#bgGrad)"/>
  
  <!-- Background pattern -->
  <circle cx="100" cy="50" r="80" fill="#f59e0b" opacity="0.1"/>
  <circle cx="300" cy="175" r="60" fill="#10b981" opacity="0.1"/>
  
  <!-- Central phone with cracked screen -->
  <g transform="translate(150, 50)">
    <!-- Phone body -->
    <rect x="0" y="0" width="100" height="140" rx="15" fill="url(#phoneGrad)" stroke="#d1d5db" stroke-width="3" filter="url(#shadow)"/>
    <!-- Screen (cracked) -->
    <rect x="8" y="15" width="84" height="110" rx="10" fill="#000000"/>
    <!-- Crack lines -->
    <path d="M20 30 L80 90 M50 25 L70 130 M30 80 L85 50" stroke="#ef4444" stroke-width="2" opacity="0.8"/>
    <path d="M15 60 L60 40 M40 120 L90 80" stroke="#ef4444" stroke-width="1.5" opacity="0.6"/>
    <!-- Screen content (partially visible) -->
    <rect x="12" y="25" width="76" height="20" rx="3" fill="#1e40af" opacity="0.7"/>
    <rect x="15" y="50" width="70" height="3" rx="1.5" fill="#60a5fa" opacity="0.5"/>
    <rect x="15" y="56" width="70" height="3" rx="1.5" fill="#60a5fa" opacity="0.5"/>
    <!-- Home button -->
    <circle cx="50" cy="135" r="4" fill="#6b7280"/>
  </g>
  
  <!-- Repair tools around the phone -->
  <!-- Screwdriver set (left) -->
  <g transform="translate(80, 100)">
    <rect x="0" y="0" width="30" height="6" fill="url(#toolGrad)" rx="3" filter="url(#shadow)"/>
    <rect x="30" y="1" width="25" height="4" fill="#d97706"/>
    <circle cx="57" cy="3" r="3" fill="#92400e"/>
    <!-- Handle grip lines -->
    <line x1="5" y1="1" x2="5" y2="5" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="10" y1="1" x2="10" y2="5" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="15" y1="1" x2="15" y2="5" stroke="#ffffff" stroke-width="0.5"/>
  </g>
  
  <!-- Smaller screwdriver -->
  <g transform="translate(70, 120)">
    <rect x="0" y="0" width="25" height="4" fill="#ef4444" rx="2"/>
    <rect x="25" y="0.5" width="20" height="3" fill="#dc2626"/>
    <circle cx="46" cy="2" r="2" fill="#991b1b"/>
  </g>
  
  <!-- Spudger tool (right) -->
  <g transform="translate(280, 110)">
    <rect x="0" y="0" width="35" height="3" fill="#374151" rx="1.5"/>
    <polygon points="35,0 40,1.5 35,3" fill="#1f2937"/>
    <polygon points="0,0 -5,1.5 0,3" fill="#1f2937"/>
  </g>
  
  <!-- Tweezers -->
  <g transform="translate(290, 130)">
    <path d="M0 0 L25 5 L30 3 L28 1 L3 -2 Z" fill="#6b7280"/>
    <path d="M0 6 L25 1 L30 3 L28 5 L3 8 Z" fill="#6b7280"/>
    <circle cx="2" cy="3" r="2" fill="#9ca3af"/>
  </g>
  
  <!-- Suction cup -->
  <g transform="translate(320, 80)">
    <circle cx="0" cy="10" r="8" fill="#3b82f6" opacity="0.7"/>
    <circle cx="0" cy="10" r="5" fill="#1e40af" opacity="0.8"/>
    <rect x="-1" y="0" width="2" height="10" fill="#374151"/>
    <circle cx="0" cy="0" r="2" fill="#6b7280"/>
  </g>
  
  <!-- Heat gun -->
  <g transform="translate(50, 160)">
    <rect x="0" y="0" width="40" height="12" fill="#374151" rx="6"/>
    <rect x="40" y="3" width="15" height="6" fill="#1f2937" rx="3"/>
    <rect x="5" y="4" width="8" height="4" fill="#ef4444"/>
    <text x="9" y="9" text-anchor="middle" font-family="Arial, sans-serif" font-size="4" fill="#ffffff">HOT</text>
  </g>
  
  <!-- Screws scattered around -->
  <circle cx="120" cy="80" r="2" fill="#6b7280"/>
  <circle cx="280" cy="60" r="2" fill="#6b7280"/>
  <circle cx="100" cy="180" r="2" fill="#6b7280"/>
  <circle cx="320" cy="170" r="2" fill="#6b7280"/>
  <circle cx="70" cy="70" r="1.5" fill="#9ca3af"/>
  <circle cx="340" cy="120" r="1.5" fill="#9ca3af"/>
  
  <!-- Instruction bubbles -->
  <g transform="translate(60, 40)">
    <ellipse cx="0" cy="0" rx="30" ry="15" fill="rgba(59,130,246,0.9)" filter="url(#shadow)"/>
    <text x="0" y="2" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ffffff">Step 1</text>
    <text x="0" y="-7" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#bfdbfe">Remove screws</text>
  </g>
  
  <g transform="translate(340, 40)">
    <ellipse cx="0" cy="0" rx="30" ry="15" fill="rgba(16,185,129,0.9)" filter="url(#shadow)"/>
    <text x="0" y="2" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ffffff">Step 2</text>
    <text x="0" y="-7" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#d1fae5">Heat & lift</text>
  </g>
  
  <!-- Central play button -->
  <g transform="translate(200, 112.5)">
    <circle cx="0" cy="0" r="25" fill="rgba(255,255,255,0.95)" filter="url(#glow)"/>
    <polygon points="-8,-10 -8,10 15,0" fill="#1e40af"/>
  </g>
  
  <!-- Warning icon -->
  <g transform="translate(350, 190)">
    <polygon points="0,-8 7,5 -7,5" fill="#f59e0b" filter="url(#shadow)"/>
    <text x="0" y="1" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#ffffff">!</text>
  </g>
  
  <!-- Title -->
  <rect x="10" y="10" width="220" height="25" fill="rgba(245,158,11,0.9)" rx="4"/>
  <text x="15" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">DIY Phone Repair Tips</text>
  
  <!-- Subtitle -->
  <rect x="50" y="195" width="300" height="20" fill="rgba(0,0,0,0.7)" rx="4"/>
  <text x="200" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ffffff">Easy Screen Replacement Guide - Save Money!</text>
  
  <!-- Difficulty level -->
  <g transform="translate(270, 10)">
    <rect x="0" y="0" width="60" height="15" fill="rgba(239,68,68,0.3)" rx="2"/>
    <text x="30" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#ffffff">⚠️ Beginner</text>
  </g>
  
  <!-- Tools needed indicator -->
  <g transform="translate(20, 170)">
    <rect x="0" y="0" width="100" height="15" fill="rgba(59,130,246,0.3)" rx="2"/>
    <text x="50" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#ffffff">🔧 Tools: ₹500 kit</text>
  </g>
  
  <!-- Time indicator -->
  <g transform="translate(130, 170)">
    <rect x="0" y="0" width="80" height="15" fill="rgba(16,185,129,0.3)" rx="2"/>
    <text x="40" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#ffffff">⏱️ 30 mins</text>
  </g>
  
  <!-- Cost saving -->
  <g transform="translate(220, 170)">
    <rect x="0" y="0" width="100" height="15" fill="rgba(139,92,246,0.3)" rx="2"/>
    <text x="50" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#ffffff">💰 Save ₹2000+</text>
  </g>
  
  <!-- Stats -->
  <g transform="translate(10, 195)">
    <rect x="0" y="0" width="80" height="20" fill="rgba(0,0,0,0.8)" rx="4"/>
    <text x="5" y="12" font-family="Arial, sans-serif" font-size="9" fill="#ffffff">👁️ 20K views</text>
  </g>
  
  <g transform="translate(350, 195)">
    <rect x="0" y="0" width="40" height="20" fill="rgba(0,0,0,0.8)" rx="4"/>
    <text x="5" y="12" font-family="Arial, sans-serif" font-size="9" fill="#ffffff">8:30</text>
  </g>
  
  <!-- Quality badge -->
  <rect x="330" y="10" width="35" height="15" fill="rgba(239,68,68,0.9)" rx="2"/>
  <text x="347.5" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#ffffff">HD</text>
  
  <!-- Timestamp -->
  <text x="240" y="25" font-family="Arial, sans-serif" font-size="8" fill="rgba(255,255,255,0.7)">2 weeks ago</text>
  
  <!-- HosurBava watermark -->
  <text x="200" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="rgba(255,255,255,0.3)">@HosurBava</text>
</svg>