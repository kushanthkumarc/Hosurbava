<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="backgroundGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="personGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#374151;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1f2937;stop-opacity:1" />
    </linearGradient>
    <!-- Shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background with subtle gradient -->
  <rect width="400" height="300" fill="url(#backgroundGrad)"/>
  
  <!-- Workshop table -->
  <rect x="50" y="200" width="300" height="80" fill="#8b5cf6" opacity="0.1" rx="8"/>
  
  <!-- Professional person figure -->
  <g transform="translate(180, 80)">
    <!-- Body -->
    <ellipse cx="20" cy="80" rx="25" ry="40" fill="url(#personGrad)" filter="url(#shadow)"/>
    <!-- Head -->
    <circle cx="20" cy="35" r="20" fill="#fbbf24" filter="url(#shadow)"/>
    <!-- Face features -->
    <circle cx="15" cy="32" r="1.5" fill="#374151"/>
    <circle cx="25" cy="32" r="1.5" fill="#374151"/>
    <path d="M15 40 Q20 45 25 40" stroke="#374151" stroke-width="1.5" fill="none"/>
    <!-- Hair -->
    <path d="M5 25 Q20 15 35 25 Q32 20 20 20 Q8 20 5 25" fill="#374151"/>
  </g>
  
  <!-- Multiple phones display -->
  <g transform="translate(80, 160)">
    <!-- Phone 1 - iPhone style -->
    <rect x="0" y="0" width="35" height="60" rx="8" fill="url(#phoneGrad)" filter="url(#shadow)"/>
    <rect x="3" y="8" width="29" height="44" rx="4" fill="#1e40af"/>
    <rect x="5" y="10" width="25" height="18" rx="2" fill="#3b82f6"/>
    <rect x="5" y="30" width="25" height="2" rx="1" fill="#60a5fa"/>
    <rect x="5" y="34" width="25" height="2" rx="1" fill="#60a5fa"/>
    <rect x="5" y="38" width="15" height="2" rx="1" fill="#60a5fa"/>
    <circle cx="17.5" cy="55" r="2" fill="#374151"/>
    
    <!-- Phone 2 - Samsung style -->
    <rect x="50" y="0" width="35" height="60" rx="6" fill="url(#phoneGrad)" filter="url(#shadow)"/>
    <rect x="53" y="6" width="29" height="48" rx="3" fill="#7c3aed"/>
    <rect x="55" y="8" width="25" height="20" rx="2" fill="#8b5cf6"/>
    <rect x="55" y="30" width="25" height="2" rx="1" fill="#a78bfa"/>
    <rect x="55" y="34" width="25" height="2" rx="1" fill="#a78bfa"/>
    <rect x="55" y="38" width="18" height="2" rx="1" fill="#a78bfa"/>
    <circle cx="60" cy="50" r="1.5" fill="#374151"/>
    <circle cx="67.5" cy="50" r="1.5" fill="#374151"/>
    <circle cx="75" cy="50" r="1.5" fill="#374151"/>
    
    <!-- Phone 3 - OnePlus style -->
    <rect x="100" y="0" width="35" height="60" rx="7" fill="url(#phoneGrad)" filter="url(#shadow)"/>
    <rect x="103" y="5" width="29" height="50" rx="4" fill="#059669"/>
    <rect x="105" y="7" width="25" height="22" rx="2" fill="#10b981"/>
    <rect x="105" y="31" width="25" height="2" rx="1" fill="#34d399"/>
    <rect x="105" y="35" width="25" height="2" rx="1" fill="#34d399"/>
    <rect x="105" y="39" width="20" height="2" rx="1" fill="#34d399"/>
    <rect x="112" y="48" width="11" height="4" rx="2" fill="#374151"/>
  </g>
  
  <!-- Tools and accessories -->
  <g transform="translate(300, 180)">
    <!-- Screwdriver -->
    <rect x="0" y="0" width="15" height="3" fill="#f59e0b" rx="1.5"/>
    <rect x="15" y="1" width="20" height="1" fill="#d97706"/>
    <circle cx="37" cy="1.5" r="1.5" fill="#92400e"/>
    
    <!-- Small screws -->
    <circle cx="5" cy="15" r="1.5" fill="#6b7280"/>
    <circle cx="15" cy="18" r="1.5" fill="#6b7280"/>
    <circle cx="25" cy="12" r="1.5" fill="#6b7280"/>
  </g>
  
  <!-- Repair workstation elements -->
  <rect x="250" y="190" width="40" height="25" fill="#e5e7eb" rx="4" filter="url(#shadow)"/>
  <rect x="255" y="195" width="30" height="15" fill="#f3f4f6" rx="2"/>
  <circle cx="270" cy="202" r="3" fill="#10b981"/>
  
  <!-- Brand text with professional styling -->
  <text x="200" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e40af">HosurBava</text>
  <text x="200" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Professional Mobile Services</text>
</svg>