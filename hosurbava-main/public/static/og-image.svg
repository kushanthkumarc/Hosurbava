<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Logo -->
  <circle cx="200" cy="200" r="60" fill="#ffffff" stroke="#f59e0b" stroke-width="4"/>
  <rect x="170" y="170" width="60" height="60" rx="8" fill="#1e40af"/>
  <rect x="180" y="180" width="40" height="30" fill="#ffffff"/>
  <circle cx="200" cy="220" r="4" fill="#ffffff"/>
  
  <!-- Main text -->
  <text x="320" y="180" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#ffffff">HosurBava</text>
  <text x="320" y="240" font-family="Arial, sans-serif" font-size="36" fill="#f59e0b">Mobile Expert &amp; Social Influencer</text>
  
  <!-- Stats -->
  <rect x="320" y="280" width="800" height="200" fill="rgba(255,255,255,0.1)" rx="20"/>
  
  <!-- Stats boxes -->
  <rect x="350" y="320" width="180" height="120" fill="rgba(255,255,255,0.2)" rx="10"/>
  <text x="440" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#ffffff">100K+</text>
  <text x="440" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#f59e0b">Followers</text>
  
  <rect x="560" y="320" width="180" height="120" fill="rgba(255,255,255,0.2)" rx="10"/>
  <text x="650" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#ffffff">5000+</text>
  <text x="650" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#f59e0b">Repairs Done</text>
  
  <rect x="770" y="320" width="180" height="120" fill="rgba(255,255,255,0.2)" rx="10"/>
  <text x="860" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#ffffff">10+</text>
  <text x="860" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#f59e0b">Years Experience</text>
  
  <!-- Bottom text -->
  <text x="600" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#ffffff">Premium Mobile Services in Hosur</text>
</svg>