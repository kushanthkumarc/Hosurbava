<svg width="400" height="225" viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="phone1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="phone2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="phone3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="phone4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="phone5Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <!-- Shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="225" fill="url(#bgGrad)"/>
  
  <!-- Background elements -->
  <circle cx="80" cy="60" r="60" fill="#10b981" opacity="0.1"/>
  <circle cx="320" cy="160" r="70" fill="#f59e0b" opacity="0.1"/>
  
  <!-- Phone 1 - Redmi Note 13 -->
  <g transform="translate(50, 45)">
    <rect x="0" y="0" width="40" height="70" rx="8" fill="url(#phone1Grad)" filter="url(#shadow)"/>
    <rect x="3" y="6" width="34" height="58" rx="5" fill="#000000"/>
    <rect x="5" y="10" width="30" height="20" rx="3" fill="#ef4444"/>
    <circle cx="32" cy="12" r="2" fill="#ffffff"/>
    <rect x="7" y="32" width="26" height="2" rx="1" fill="#fca5a5"/>
    <rect x="7" y="36" width="26" height="2" rx="1" fill="#fca5a5"/>
    <rect x="7" y="40" width="20" height="2" rx="1" fill="#fca5a5"/>
    <text x="20" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#ffffff">Redmi</text>
  </g>
  
  <!-- Price tag 1 -->
  <g transform="translate(40, 120)">
    <rect x="0" y="0" width="60" height="20" fill="#10b981" rx="4" filter="url(#shadow)"/>
    <text x="30" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff">₹15,999</text>
  </g>
  
  <!-- Phone 2 - Realme C67 -->
  <g transform="translate(120, 45)">
    <rect x="0" y="0" width="40" height="70" rx="8" fill="url(#phone2Grad)" filter="url(#shadow)"/>
    <rect x="3" y="6" width="34" height="58" rx="5" fill="#000000"/>
    <rect x="5" y="10" width="30" height="22" rx="3" fill="#3b82f6"/>
    <circle cx="30" cy="14" r="2" fill="#ffffff"/>
    <rect x="7" y="34" width="26" height="2" rx="1" fill="#93c5fd"/>
    <rect x="7" y="38" width="26" height="2" rx="1" fill="#93c5fd"/>
    <rect x="7" y="42" width="18" height="2" rx="1" fill="#93c5fd"/>
    <text x="20" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#ffffff">realme</text>
  </g>
  
  <!-- Price tag 2 -->
  <g transform="translate(110, 120)">
    <rect x="0" y="0" width="60" height="20" fill="#10b981" rx="4" filter="url(#shadow)"/>
    <text x="30" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff">₹17,499</text>
  </g>
  
  <!-- Phone 3 - Poco X6 -->
  <g transform="translate(190, 45)">
    <rect x="0" y="0" width="40" height="70" rx="8" fill="url(#phone3Grad)" filter="url(#shadow)"/>
    <rect x="3" y="6" width="34" height="58" rx="5" fill="#000000"/>
    <rect x="5" y="10" width="30" height="22" rx="3" fill="#10b981"/>
    <circle cx="28" cy="14" r="2" fill="#ffffff"/>
    <rect x="7" y="34" width="26" height="2" rx="1" fill="#6ee7b7"/>
    <rect x="7" y="38" width="26" height="2" rx="1" fill="#6ee7b7"/>
    <rect x="7" y="42" width="22" height="2" rx="1" fill="#6ee7b7"/>
    <text x="20" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#ffffff">POCO</text>
  </g>
  
  <!-- Price tag 3 -->
  <g transform="translate(180, 120)">
    <rect x="0" y="0" width="60" height="20" fill="#10b981" rx="4" filter="url(#shadow)"/>
    <text x="30" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff">₹18,999</text>
  </g>
  
  <!-- Phone 4 - Vivo T3x -->
  <g transform="translate(260, 45)">
    <rect x="0" y="0" width="40" height="70" rx="8" fill="url(#phone4Grad)" filter="url(#shadow)"/>
    <rect x="3" y="6" width="34" height="58" rx="5" fill="#000000"/>
    <rect x="5" y="10" width="30" height="22" rx="3" fill="#8b5cf6"/>
    <circle cx="25" cy="14" r="2" fill="#ffffff"/>
    <rect x="7" y="34" width="26" height="2" rx="1" fill="#c4b5fd"/>
    <rect x="7" y="38" width="26" height="2" rx="1" fill="#c4b5fd"/>
    <rect x="7" y="42" width="20" height="2" rx="1" fill="#c4b5fd"/>
    <text x="20" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#ffffff">vivo</text>
  </g>
  
  <!-- Price tag 4 -->
  <g transform="translate(250, 120)">
    <rect x="0" y="0" width="60" height="20" fill="#10b981" rx="4" filter="url(#shadow)"/>
    <text x="30" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff">₹19,499</text>
  </g>
  
  <!-- Phone 5 - Samsung M35 -->
  <g transform="translate(330, 45)">
    <rect x="0" y="0" width="40" height="70" rx="8" fill="url(#phone5Grad)" filter="url(#shadow)"/>
    <rect x="3" y="6" width="34" height="58" rx="5" fill="#000000"/>
    <rect x="5" y="10" width="30" height="22" rx="3" fill="#f59e0b"/>
    <circle cx="27" cy="14" r="2" fill="#ffffff"/>
    <rect x="7" y="34" width="26" height="2" rx="1" fill="#fde68a"/>
    <rect x="7" y="38" width="26" height="2" rx="1" fill="#fde68a"/>
    <rect x="7" y="42" width="18" height="2" rx="1" fill="#fde68a"/>
    <text x="20" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="4" fill="#ffffff">SAMSUNG</text>
  </g>
  
  <!-- Price tag 5 -->
  <g transform="translate(320, 120)">
    <rect x="0" y="0" width="60" height="20" fill="#10b981" rx="4" filter="url(#shadow)"/>
    <text x="30" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff">₹19,999</text>
  </g>
  
  <!-- Central play button -->
  <g transform="translate(200, 112.5)">
    <circle cx="0" cy="0" r="25" fill="rgba(255,255,255,0.95)" filter="url(#glow)"/>
    <polygon points="-8,-10 -8,10 15,0" fill="#1e40af"/>
  </g>
  
  <!-- Title -->
  <rect x="10" y="10" width="250" height="25" fill="rgba(16,185,129,0.9)" rx="4"/>
  <text x="15" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Best Budget Phones Under ₹20K</text>
  
  <!-- Subtitle -->
  <rect x="50" y="150" width="300" height="20" fill="rgba(0,0,0,0.7)" rx="4"/>
  <text x="200" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ffffff">HosurBava's Top 5 Picks with Honest Reviews</text>
  
  <!-- Features comparison -->
  <g transform="translate(50, 175)">
    <rect x="0" y="0" width="80" height="15" fill="rgba(59,130,246,0.3)" rx="2"/>
    <text x="40" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#ffffff">📸 Camera</text>
    
    <rect x="90" y="0" width="80" height="15" fill="rgba(16,185,129,0.3)" rx="2"/>
    <text x="130" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#ffffff">🔋 Battery</text>
    
    <rect x="180" y="0" width="80" height="15" fill="rgba(139,92,246,0.3)" rx="2"/>
    <text x="220" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#ffffff">🎮 Gaming</text>
    
    <rect x="270" y="0" width="80" height="15" fill="rgba(245,158,11,0.3)" rx="2"/>
    <text x="310" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#ffffff">💰 Value</text>
  </g>
  
  <!-- Stats -->
  <g transform="translate(10, 195)">
    <rect x="0" y="0" width="80" height="20" fill="rgba(0,0,0,0.8)" rx="4"/>
    <text x="5" y="12" font-family="Arial, sans-serif" font-size="9" fill="#ffffff">👁️ 20K views</text>
  </g>
  
  <g transform="translate(350, 195)">
    <rect x="0" y="0" width="40" height="20" fill="rgba(0,0,0,0.8)" rx="4"/>
    <text x="5" y="12" font-family="Arial, sans-serif" font-size="9" fill="#ffffff">12:45</text>
  </g>
  
  <!-- Quality badge -->
  <rect x="350" y="10" width="35" height="15" fill="rgba(239,68,68,0.9)" rx="2"/>
  <text x="367.5" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#ffffff">HD</text>
  
  <!-- Timestamp -->
  <text x="270" y="25" font-family="Arial, sans-serif" font-size="8" fill="rgba(255,255,255,0.7)">1 week ago</text>
  
  <!-- HosurBava watermark -->
  <text x="200" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="rgba(255,255,255,0.3)">@HosurBava</text>
</svg>